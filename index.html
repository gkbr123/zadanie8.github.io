<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Обратная связь</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header class="site-header">
        <h1>Обратная связь</h1>
        <p>Остались вопросы? Свяжитесь с нами!</p>
        <button type="button" id="open-form">
            Открыть форму
        </button>
    </header>

    <main class="container">
        <section class="content">
            <h2>Свяжитесь с нами</h2>
            <p>
                Нажмите на кнопку выше, чтобы открыть форму обратной связи.
                Заполните необходимые поля, и мы получим ваше сообщение.
            </p>
        </section>
    </main>

    <div class="modal" id="contact-modal" aria-hidden="true">
        <div class="modal-overlay" id="modal-overlay"></div>

        <section class="modal-content"
                 role="dialog"
                 aria-modal="true"
                 aria-labelledby="modal-title">

            <button type="button"
                    class="close-button"
                    id="close-form"
                    aria-label="Закрыть форму">
                &times;
            </button>

            <h2 id="modal-title">Форма обратной связи</h2>

            <form id="contact-form" novalidate>

                <div class="form-group">
                    <label for="fullname">ФИО</label>
                    <input
                        type="text"
                        id="fullname"
                        name="fullname"
                        placeholder="Иванов Иван Иванович"
                        required
                        maxlength="100"
                    >
                    <small class="field-error" id="fullname-error"></small>
                </div>

                <div class="form-group">
                    <label for="email">Электронная почта</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="example@mail.com"
                        required
                        maxlength="100"
                    >
                    <small class="field-error" id="email-error"></small>
                </div>

                <div class="form-group">
                    <label for="phone">Телефон</label>
                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="+37112345678"
                        required
                        maxlength="16"
                    >
                    <small class="field-error" id="phone-error"></small>
                </div>

                <div class="form-group">
                    <label for="organization">Организация</label>
                    <input
                        type="text"
                        id="organization"
                        name="organization"
                        placeholder="Название организации"
                        required
                        maxlength="100"
                    >
                    <small class="field-error" id="organization-error"></small>
                </div>

                <div class="form-group full-width">
                    <label for="message">Сообщение</label>
                    <textarea
                        id="message"
                        name="message"
                        placeholder="Введите ваше сообщение..."
                        required
                        minlength="10"
                        maxlength="1000"
                        rows="3"
                    ></textarea>
                    <small class="field-error" id="message-error"></small>
                </div>

                <div class="form-group full-width consent-group">
                    <label class="checkbox-label">
                        <input
                            type="checkbox"
                            id="consent"
                            name="consent"
                            required
                        >
                        <span>
                            Я согласен на обработку персональных данных
                        </span>
                    </label>
                    <small class="field-error" id="consent-error"></small>
                </div>

                <div class="form-group full-width">
                    <button type="submit" id="submit-button">
                        Отправить
                    </button>
                </div>

                <p id="form-status"
                   class="form-status"
                   aria-live="polite"></p>

            </form>
        </section>
    </div>

    <footer class="site-footer">
        <p>Форма обратной связи · 2026</p>
    </footer>

</body>
</html>
