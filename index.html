<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма обратной связи</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header class="site-header">
        <h1>Форма обратной связи</h1>
        <p>Есть вопросы? Мы будем рады получить ваше сообщение.</p>
    </header>

    <main class="container">
        <section class="intro">
            <h2>Свяжитесь с нами</h2>
            <p>
                Нажмите на кнопку ниже, чтобы открыть форму
                обратной связи.
            </p>
            <button type="button" id="open-form" class="open-button">
                Открыть форму
            </button>
        </section>
    </main>

    <footer class="site-footer">
        <p>Форма обратной связи · 2026</p>
    </footer>

    <div
        class="modal"
        id="contact-modal"
        aria-hidden="true"
    >
        <div class="modal-overlay" id="modal-overlay"></div>

        <section
            class="modal-content"
            role="dialog"
            aria-modal="true"
            aria-labelledby="modal-title"
        >
            <button
                type="button"
                class="close-button"
                id="close-form"
                aria-label="Закрыть форму"
            >
                &times;
            </button>

            <h2 id="modal-title">Обратная связь</h2>

            <form id="contact-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="fullname">ФИО:</label>
                        <input
                            type="text"
                            id="fullname"
                            name="fullname"
                            autocomplete="name"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            autocomplete="email"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="phone">Телефон:</label>
                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            autocomplete="tel"
                            placeholder="+371..."
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="organization">Организация:</label>
                        <input
                            type="text"
                            id="organization"
                            name="organization"
                            autocomplete="organization"
                        >
                    </div>

                    <div class="form-group message-group">
                        <label for="message">Сообщение:</label>
                        <textarea
                            id="message"
                            name="message"
                            rows="3"
                            required
                        ></textarea>
                    </div>
                </div>

                <div class="consent-group">
                    <input
                        type="checkbox"
                        id="consent"
                        name="consent"
                        value="Согласие предоставлено"
                        required
                    >
                    <label for="consent">
                        Я согласен с обработкой персональных данных
                        в соответствии с политикой конфиденциальности.
                    </label>
                </div>

                <button type="submit" id="submit-button">
                    Отправить
                </button>

                <p
                    id="form-status"
                    class="form-status"
                    role="status"
                    aria-live="polite"
                ></p>
            </form>
        </section>
    </div>
</body>
</html>
